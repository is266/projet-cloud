name: CI

on:
  push:
    branches: [main]
    paths: ['app/**']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Test simple
        run: grep -q "Bonjour" app/index.html

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et envoyer l'image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/projet-cloud:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/projet-cloud:latest
